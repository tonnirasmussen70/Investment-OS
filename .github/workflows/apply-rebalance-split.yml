name: Apply Rebalancering Split

on:
  push:
    branches: [main]
    paths:
      - 'update_rebalance_split.py'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply update
        run: python update_rebalance_split.py
      - name: Validate syntax
        run: python -m py_compile app.py
      - name: Commit update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py
          git commit -m "Split rebalancing into stocks and ETFs" || exit 0
          git push
