name: Sync 7.0 with main

on:
  push:
    branches:
      - investment-os-7.0-execution-layer

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: investment-os-7.0-execution-layer
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Merge latest main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git merge --no-edit origin/main
      - name: Install test dependencies
        run: pip install pandas numpy
      - name: Syntax check
        run: python -m py_compile app.py modules/decision_engine.py modules/opportunity_engine.py modules/decision_queue_engine.py modules/rebalance_engine.py modules/snapshot_engine.py
      - name: Decision Engine regression tests
        run: python -m unittest tests.test_decision_engine_consistency -v
      - name: Execution-layer regression tests
        run: python -m unittest tests.test_rebalance_execution -v
      - name: Push synchronized branch
        run: git push origin investment-os-7.0-execution-layer
