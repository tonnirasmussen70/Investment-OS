name: Apply Rebalancering Update

on:
  push:
    branches: [main]
    paths:
      - "update_rebalance_tab.py"
      - "rebalance_tab_replacement.py"
      - ".github/workflows/apply-rebalance-update.yml"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Apply update
        run: python update_rebalance_tab.py

      - name: Validate syntax
        run: python -m py_compile app.py modules/portfolio_engine.py

      - name: Commit app.py and clean up
        run: |
          rm -f update_rebalance_tab.py rebalance_tab_replacement.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py update_rebalance_tab.py rebalance_tab_replacement.py
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update Rebalancering tab"
            git push
          fi
