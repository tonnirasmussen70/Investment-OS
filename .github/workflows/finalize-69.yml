name: Finalize Investment OS 6.9

on:
  push:
    branches:
      - investment-os-6.9-engine-consolidation

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: investment-os-6.9-engine-consolidation
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: pip install pandas numpy
      - name: Apply final 6.9 patch
        run: python scripts/finalize_69.py
      - name: Syntax check
        run: |
          python -m py_compile \
            app.py \
            modules/decision_engine.py \
            modules/opportunity_engine.py \
            modules/decision_queue_engine.py \
            modules/rebalance_engine.py
      - name: Decision Engine smoke test
        run: |
          python - <<'PY'
          import pandas as pd
          from modules.decision_engine import apply_decision_engine, decision_summary

          frame = pd.DataFrame([
              {
                  'Name': 'Strong', 'Composite': 0.18, 'AI_Confidence': 82,
                  'Relative_Strength_3M': 0.05, 'Volatility': 0.25,
                  'Max_Drawdown': -0.12, 'Momentum_Data_Quality': 1.0,
                  'Portfolio_Weight': 0.06, '1W': 0.03, '1M': 0.06,
                  '3M': 0.15, '6M': 0.20, 'Momentum_Acceleration': 0.02,
                  'Rotation_Signal': 'Accelererer',
              },
              {
                  'Name': 'Weak', 'Composite': -0.10, 'AI_Confidence': 35,
                  'Relative_Strength_3M': -0.08, 'Volatility': 0.50,
                  'Max_Drawdown': -0.38, 'Momentum_Data_Quality': 1.0,
                  'Portfolio_Weight': 0.05, '1W': -0.04, '1M': -0.07,
                  '3M': -0.12, '6M': -0.10, 'Momentum_Acceleration': -0.02,
                  'Rotation_Signal': 'Negativ rotation',
              },
          ])
          custom_weights = {
              'Momentum': 0.35, 'AI Confidence': 0.15,
              'Relative Strength': 0.15, 'Trend': 0.15,
              'Risiko': 0.08, 'Datakvalitet': 0.07, 'Positionsbonus': 0.05,
          }
          scored = apply_decision_engine(
              frame, factor_weights=custom_weights, max_position_weight=0.12
          ).data
          before = scored['Decision_Score'].copy()
          summary = decision_summary(scored)
          after = scored['Decision_Score'].copy()
          assert before.equals(after), 'decision_summary må ikke genberegne score'
          assert scored['Opportunity Score'].equals(scored['Decision_Score'])
          assert scored['Opportunity Label'].equals(scored['Decision_Status'])
          assert scored.loc[0, 'Handling'] == 'Øg'
          assert scored.loc[1, 'Handling'] == 'Reducer'
          assert summary['Top_Decision_Asset'] == 'Strong'
          print(scored[['Name','Decision_Score','Decision_Status','Handling']])
          PY
      - name: Commit final changes
        run: |
          if git diff --quiet -- app.py modules/decision_engine.py; then
            echo "No code changes required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py modules/decision_engine.py
          git commit -m "6.9: finalize consolidated Decision Engine"
          git push
