name: Apply Investment OS 6.9 UI

on:
  push:
    branches:
      - investment-os-6.9-engine-consolidation

permissions:
  contents: write

jobs:
  apply-ui:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: investment-os-6.9-engine-consolidation
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply 6.9 consolidation patch
        run: python scripts/apply_69_ui.py
      - name: Syntax check
        run: |
          python -m py_compile \
            app.py \
            modules/decision_engine.py \
            modules/opportunity_engine.py \
            modules/decision_queue_engine.py \
            modules/rebalance_engine.py
      - name: Commit generated changes
        run: |
          if git diff --quiet -- app.py modules/decision_engine.py modules/opportunity_engine.py; then
            echo "No code changes required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py modules/decision_engine.py modules/opportunity_engine.py
          git commit -m "6.9: run canonical Decision Engine before all views"
          git push
