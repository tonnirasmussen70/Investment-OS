name: Apply Active Model Settings

on:
  push:
    paths:
      - update_active_model_settings.py
      - .github/workflows/apply-active-model-settings.yml

permissions:
  contents: write

jobs:
  update-app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply update
        run: python update_active_model_settings.py
      - name: Syntax check
        run: python -m py_compile app.py modules/rebalance_engine.py
      - name: Commit result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py
          git commit -m "Activate editable model settings" || exit 0
          git push
