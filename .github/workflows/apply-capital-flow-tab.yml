name: Apply Capital Flow Tab

on:
  push:
    paths:
      - "update_capital_flow_tab.py"
      - ".github/workflows/apply-capital-flow-tab.yml"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Update app.py
        run: python update_capital_flow_tab.py
      - name: Validate syntax
        run: python -m py_compile app.py
      - name: Commit result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py
          git diff --cached --quiet || git commit -m "Add Capital Flow tab"
          git push
