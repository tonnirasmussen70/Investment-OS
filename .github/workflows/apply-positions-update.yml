name: Apply Positioner Update

on:
  push:
    branches: [main]
    paths:
      - "update_positions_tab.py"
      - "positions_tab_replacement.py"
      - ".github/workflows/apply-positions-update.yml"

permissions:
  contents: write

jobs:
  apply-update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Apply Positioner update
        run: python update_positions_tab.py

      - name: Validate syntax
        run: python -m py_compile app.py modules/portfolio_engine.py

      - name: Remove temporary files
        run: rm update_positions_tab.py positions_tab_replacement.py

      - name: Commit updated app
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py update_positions_tab.py positions_tab_replacement.py
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update Positioner tab with separate ASK views"
            git push
          fi
