name: Cleanup Investment OS 6.9 output

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: pip install pandas numpy
      - name: Apply canonical output cleanup
        run: python scripts/cleanup_69_output.py
      - name: Syntax check
        run: |
          python -m py_compile \
            app.py \
            modules/decision_engine.py \
            modules/opportunity_engine.py \
            modules/decision_queue_engine.py \
            modules/snapshot_engine.py \
            scripts/generate_portfolio_snapshot.py \
            tests/test_decision_engine_consistency.py
      - name: Regression tests
        run: python -m unittest tests.test_decision_engine_consistency -v
      - name: Verify canonical runtime output
        run: |
          python - <<'PY'
          import pandas as pd
          from modules.decision_engine import apply_decision_engine
          from modules.opportunity_engine import build_opportunity_scores

          frame = pd.DataFrame([{
              'Name': 'Test', 'Composite': 0.12, 'AI_Confidence': 80,
              'Relative_Strength_3M': 0.04, 'Volatility': 0.25,
              'Max_Drawdown': -0.12, 'Momentum_Data_Quality': 1.0,
              'Portfolio_Weight': 0.05, '1W': 0.02, '1M': 0.04,
              '3M': 0.10, '6M': 0.14, 'Momentum_Acceleration': 0.01,
              'Rotation_Signal': 'Neutral',
          }])
          scored = apply_decision_engine(frame).data
          opportunities = build_opportunity_scores(scored).data
          forbidden = {'Opportunity Score', 'Opportunity Label', 'Opportunity Rank', 'Decision Label'}
          assert not forbidden.intersection(scored.columns)
          assert not forbidden.intersection(opportunities.columns)
          assert {'Decision_Score', 'Decision_Status', 'Handling', 'Decision Rank'}.issubset(opportunities.columns)
          print('Canonical output naming verified')
          PY
      - name: Commit cleanup
        run: |
          if git diff --quiet -- app.py modules scripts tests; then
            echo "No runtime changes required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py modules scripts/generate_portfolio_snapshot.py tests
          git commit -m "6.9: remove legacy decision output aliases"
          git push
