name: Apply Compounder Pipeline 7.1

on:
  push:
    paths:
      - "update_compounder_pipeline_7_1.py"
      - ".github/workflows/apply-compounder-pipeline-7-1.yml"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Update app.py
        run: python update_compounder_pipeline_7_1.py
      - name: Validate syntax
        run: |
          python -m py_compile app.py
          python -m py_compile modules/compounder_engine.py
      - name: Commit result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py
          git diff --cached --quiet || git commit -m "Upgrade Investment OS to 7.1 Compounder Pipeline"
          git push
