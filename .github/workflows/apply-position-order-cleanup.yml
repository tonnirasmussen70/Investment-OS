name: Apply Position Order Cleanup

on:
  push:
    paths:
      - 'update_position_order_cleanup.py'
      - '.github/workflows/apply-position-order-cleanup.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply update
        run: python update_position_order_cleanup.py
      - name: Syntax check
        run: python -m py_compile app.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py
          git diff --cached --quiet || git commit -m "Adjust Positioner and Capitalflow tab order"
          git push
