name: Backup snapshot

on:
  workflow_dispatch:
  schedule:
    - cron: "15 2 * * *"

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Create backup archive
        run: python scripts/create_backup.py --output backup_output
      - name: Create source bundle
        run: git bundle create backup_output/Investment-OS.bundle --all
      - name: Verify source bundle
        run: git bundle verify backup_output/Investment-OS.bundle
      - name: Upload backup artifact
        uses: actions/upload-artifact@v4
        with:
          name: investment-os-backup
          path: backup_output/
          if-no-files-found: error
          retention-days: 30
