name: Generate integrated portfolio snapshot

on:
  workflow_dispatch:
  schedule:
    - cron: "25 4 * * *"
  push:
    branches:
      - main
    paths:
      - "app.py"
      - "data/AI_portfolio.xlsx"
      - "modules/**"
      - "scripts/generate_portfolio_snapshot.py"
      - ".github/workflows/generate-portfolio-snapshot.yml"

permissions:
  contents: write

concurrency:
  group: integrated-portfolio-snapshot
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate portfolio snapshot
        env:
          PYTHONPATH: .
        run: python scripts/generate_portfolio_snapshot.py

      - name: Verify snapshot
        run: |
          test -f data/portfolio_snapshot.json
          python -m json.tool data/portfolio_snapshot.json > /dev/null

      - name: Commit updated snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/portfolio_snapshot.json

          if git diff --cached --quiet; then
            echo "No snapshot changes to commit."
          else
            git commit -m "Update portfolio snapshot"
            git pull --rebase origin main
            git push origin main
          fi
