name: Generate integrated portfolio snapshot

on:
  workflow_dispatch:
  schedule:
    - cron: "25 4 * * *"
  push:
    branches: [main]
    paths:
      - "app.py"
      - "data/AI_portfolio.xlsx"
      - "modules/**"
      - ".github/workflows/generate-portfolio-snapshot.yml"

permissions:
  contents: write

concurrency:
  group: integrated-portfolio-snapshot
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Investment OS in snapshot mode
        env:
          PYTHONPATH: .
          INVESTMENT_OS_SNAPSHOT_ONLY: "1"
       run: python scripts/generate_portfolio_snapshot.py

      - name: Verify snapshot
        run: |
          test -f data/portfolio_snapshot.json
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("data/portfolio_snapshot.json")
          payload = json.loads(path.read_text(encoding="utf-8"))

          required = [
              "generated_at",
              "source",
              "data_quality",
              "portfolio",
              "positions",
              "decision_queue",
          ]
          missing = [key for key in required if key not in payload]
          if missing:
              raise SystemExit(f"Snapshot mangler felter: {missing}")

          print(
              "Snapshot OK:",
              payload["generated_at"],
              "positions=",
              len(payload["positions"]),
          )
          PY

      - name: Commit snapshot when changed
        run: |
          if git diff --quiet -- data/portfolio_snapshot.json; then
            echo "Snapshot unchanged"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/portfolio_snapshot.json
          git commit -m "Update integrated portfolio snapshot"
          git push
