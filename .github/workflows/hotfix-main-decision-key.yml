name: Hotfix main Decision Engine settings key

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  hotfix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: pip install pandas numpy
      - name: Apply hotfix
        run: python scripts/fix_main_decision_key.py
      - name: Syntax check
        run: python -m py_compile app.py
      - name: Decision Engine regression tests
        run: python -m unittest tests.test_decision_engine_consistency -v
      - name: Commit hotfix
        run: |
          if git diff --quiet -- app.py; then
            echo "No app change required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py
          git commit -m "Fix Decision Engine settings session key on main"
          git push
