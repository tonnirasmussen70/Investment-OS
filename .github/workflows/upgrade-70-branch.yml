name: Investment OS 7.0 branch integration

on:
  push:
    branches:
      - investment-os-7.0-execution-layer

permissions:
  contents: write

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: investment-os-7.0-execution-layer
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: pip install pandas numpy
      - name: Apply 7.0 app integration
        run: python scripts/apply_70_upgrade.py
      - name: Syntax check
        run: |
          python -m py_compile \
            app.py \
            modules/rebalance_engine.py \
            modules/snapshot_engine.py \
            scripts/generate_portfolio_snapshot.py \
            tests/test_decision_engine_consistency.py \
            tests/test_rebalance_execution.py
      - name: Decision Engine regression tests
        run: python -m unittest tests.test_decision_engine_consistency -v
      - name: Execution-layer regression tests
        run: python -m unittest tests.test_rebalance_execution -v
      - name: Commit 7.0 integration
        run: |
          if git diff --quiet -- app.py scripts/generate_portfolio_snapshot.py; then
            echo "No app integration changes required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py scripts/generate_portfolio_snapshot.py
          git commit -m "7.0: integrate execution layer in app"
          git push
